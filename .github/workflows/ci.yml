name: Tests
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      chromatic-playwright-version:
        description: 'Version of "@chromatic-com/playwright" to install (npm version/tag or pkg.pr.new URL). Leave empty to use package.json.'
        required: false
        default: ''

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install dependencies
        run: pnpm i

      - name: Install @chromatic-com/playwright@${{ inputs.chromatic-playwright-version }}
        if: ${{ inputs.chromatic-playwright-version != '' }}
        env:
          VERSION: ${{ inputs.chromatic-playwright-version }}
        run: |
          if [[ "$VERSION" == *"://"* ]]; then
            pnpm add -D "$VERSION"
          else
            pnpm add -D "@chromatic-com/playwright@$VERSION"
          fi
          pnpm ls @chromatic-com/playwright

      - name: Run tests
        run: pnpm run test

      - name: Test Storybook
        run: pnpm test:storybook

      - name: Run Chromatic tests
        uses: chromaui/action@latest
        with:
          playwright: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
